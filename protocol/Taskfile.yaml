version: '3'

tasks:
  validate:
    desc: Every example in examples/valid passes, every example in examples/invalid fails for its expected rule, and the unions agree with the schema files
    cmds:
      - uv run scripts/validate.py

  test:
    desc: Test the validator on fixture schemas
    cmds:
      - uv run --with pytest --with jsonschema --with referencing pytest -q

  check:
    desc: The CI gate. test, validate
    cmds:
      - task: test
      - task: validate
