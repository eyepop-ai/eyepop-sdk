name: Release node

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      publish:
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Fails if package-lock.json is out of sync with the manifests, before stamping changes them.
      - run: npm ci --no-audit --no-fund
        working-directory: node
      - run: task node:check
      - run: task node:stamp TAG="$TAG"
      - run: task node:build
      - run: mkdir -p "$RUNNER_TEMP/out" && npm pack --workspaces --pack-destination "$RUNNER_TEMP/out"
        working-directory: node
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eyepop-node-${{ inputs.tag }}
          path: ${{ runner.temp }}/out/*.tgz
          if-no-files-found: error
      - if: ${{ !inputs.publish }}
        run: echo "publish is off, would publish to npm here"
      - if: ${{ inputs.publish }}
        run: task node:publish TAG="$TAG"
      - if: ${{ inputs.publish }}
        run: task node:verify TAG="$TAG"
