name: Release node

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Fails if package-lock.json is out of sync with the manifests, before stamping changes them.
      - run: npm ci --no-audit --no-fund
        working-directory: node
      - run: task node:check
      - run: task node:stamp TAG="$TAG"
      - run: task node:publish TAG="$TAG"
      - run: task node:verify TAG="$TAG"
