name: Release cs

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      publish:
        type: boolean
        default: false

# nuget.org profile name that owns the trusted publishing policy. Not a secret.
env:
  NUGET_USER: eyepop-ai

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # NuGet trusted publishing
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cs
      - run: task cs:check
      - run: task cs:publish:dry-run TAG="$TAG"
      - run: task cs:package TAG="$TAG" OUT="$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eyepop-cs-${{ inputs.tag }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
      - if: ${{ !inputs.publish }}
        run: echo "publish is off, would publish to nuget.org here"
      # Trusted publishing: exchanges the job's OIDC token for an API key that lives 1 hour, so it comes right before the push.
      - id: login
        if: ${{ inputs.publish }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ env.NUGET_USER }} # nuget.org profile name, not an email address
      - if: ${{ inputs.publish }}
        run: task cs:publish TAG="$TAG"
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      - if: ${{ inputs.publish }}
        run: task cs:verify TAG="$TAG"
