name: CI node

on:
  pull_request:
    paths: &paths
      - 'node/**'
      - 'scripts/**'
      - '.github/workflows/ci-node.yml'
  push:
    branches: [main]
    paths: *paths

concurrency:
  group: ci-node-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: node/package-lock.json
      # Fails if package-lock.json is out of sync with the manifests.
      - run: npm ci --no-audit --no-fund
      # Same as `task node:check` from the repo root.
      - run: task check
      - name: Release dry-run
        run: |
          task stamp TAG=v0.0.0-alpha.0
          task publish:dry-run TAG=v0.0.0-alpha.0
