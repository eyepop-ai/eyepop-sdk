name: CI protocol

on:
  pull_request:
    paths: &paths
      - 'protocol/**'
      - '.github/workflows/ci-protocol.yaml'
      - '.github/actions/setup-go/**'
      - 'python/src/eyepop/protocol.py'
      - 'rust/crates/eyepop/src/protocol.rs'
      - 'go/protocol.go'
      - 'cs/src/EyePop/Protocol.g.cs'
  push:
    branches: [main]
    paths: *paths

concurrency:
  group: ci-protocol-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: task check
        working-directory: protocol
