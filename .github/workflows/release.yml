name: Release

# Lockstep release: publishing a GitHub release at tag vX.Y.Z publishes every Language SDK at that version.
# Re-run failed jobs is safe: every publish task skips a version that is already on its registry.
# Registry uploads happen only for a published GitHub release with the repo variable PUBLISH_TO_REGISTRIES=true.
# Without it, every run still builds each package and stores it as a workflow artifact (eyepop-<language>-<tag>),
# and the publish steps just say where they would upload. Run it by hand on any branch to get the artifacts:
#   gh workflow run release.yml -f tag=v4.0.0-alpha.1
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build artifacts for, e.g. v4.0.0-alpha.1 (never uploads to a registry)
        type: string
        required: true

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions: {}

jobs:
  # The one place that decides the tag and whether this run uploads to registries; every release job reads these outputs.
  verify-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: release
        name: Validate tag for every ecosystem
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PUBLISH: ${{ github.event_name == 'release' && vars.PUBLISH_TO_REGISTRIES == 'true' }}
        run: |
          scripts/verify-tag.sh "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  node:
    needs: verify-tag
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_release-node.yml
    with:
      tag: ${{ needs.verify-tag.outputs.tag }}
      publish: ${{ needs.verify-tag.outputs.publish == 'true' }}

  python:
    needs: verify-tag
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_release-python.yml
    with:
      tag: ${{ needs.verify-tag.outputs.tag }}
      publish: ${{ needs.verify-tag.outputs.publish == 'true' }}

  go:
    needs: verify-tag
    permissions:
      contents: write # go:publish pushes the go/vX.Y.Z tag
    uses: ./.github/workflows/_release-go.yml
    with:
      tag: ${{ needs.verify-tag.outputs.tag }}
      publish: ${{ needs.verify-tag.outputs.publish == 'true' }}

  rust:
    needs: verify-tag
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_release-rust.yml
    with:
      tag: ${{ needs.verify-tag.outputs.tag }}
      publish: ${{ needs.verify-tag.outputs.publish == 'true' }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  cs:
    needs: verify-tag
    permissions:
      contents: read
    uses: ./.github/workflows/_release-cs.yml
    with:
      tag: ${{ needs.verify-tag.outputs.tag }}
      publish: ${{ needs.verify-tag.outputs.publish == 'true' }}
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  # Red until all five languages are published (including when verify-tag failed and the rest were skipped).
  release-summary:
    if: always()
    needs: [verify-tag, node, python, go, rust, cs]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: scripts/release-summary.sh
