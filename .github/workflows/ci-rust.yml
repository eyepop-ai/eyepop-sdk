name: CI rust

on:
  pull_request:
    paths: &paths
      - 'rust/**'
      - 'scripts/**'
      - '.github/workflows/ci-rust.yml'
  push:
    branches: [main]
    paths: *paths

concurrency:
  group: ci-rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; toolchain pinned via input
        with:
          toolchain: stable
          components: rustfmt, clippy
      # Same as `task rust:check` from the repo root.
      - run: task check
      - name: Release dry-run
        run: task publish:dry-run TAG=v0.0.0-alpha.0
