name: Release cs

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      publish:
        type: boolean
        default: false
    secrets:
      NUGET_API_KEY:
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cs
      - run: task cs:check
      - run: task cs:publish:dry-run TAG="$TAG"
      - run: task cs:package TAG="$TAG" OUT="$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eyepop-cs-${{ inputs.tag }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
      - if: ${{ !inputs.publish }}
        run: echo "publish is off, would publish to nuget.org here"
      # shortcut: scoped API key; upgrade to NuGet trusted publishing (OIDC, NuGet/login) once a policy exists, then drop the secret.
      - if: ${{ inputs.publish }}
        run: task cs:publish TAG="$TAG"
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      - if: ${{ inputs.publish }}
        run: task cs:verify TAG="$TAG"
