name: Release cs

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      NUGET_API_KEY:
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ github.token }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - run: task cs:stamp TAG="$TAG"
      - run: task cs:build
      - run: task cs:test
      # shortcut: scoped API key; upgrade to NuGet trusted publishing (OIDC, NuGet/login) once a policy exists, then drop the secret.
      - run: task cs:publish TAG="$TAG"
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      - run: task cs:verify TAG="$TAG"
