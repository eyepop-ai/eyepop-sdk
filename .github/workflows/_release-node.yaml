name: Release node

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      publish:
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: task node:check
      - run: task node:publish:dry-run TAG="$TAG"
      - run: task node:package TAG="$TAG" OUT="$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eyepop-node-${{ inputs.tag }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
      - if: ${{ !inputs.publish }}
        run: echo "publish is off, would publish to npm here"
      - if: ${{ inputs.publish }}
        run: task node:publish TAG="$TAG"
      - if: ${{ inputs.publish }}
        run: task node:verify TAG="$TAG"
