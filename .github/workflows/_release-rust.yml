name: Release rust

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      publish:
        type: boolean
        default: false
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; toolchain pinned via input
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: task rust:check
      # The dry run stamps the manifest and packages the crate; publish refuses a dirty tree, so revert the stamp after.
      - run: task rust:publish:dry-run TAG="$TAG"
      # The dry run leaves no .crate behind, so package it for the artifact (the manifest is already stamped).
      - run: cargo package -p eyepop --allow-dirty
        working-directory: rust
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eyepop-rust-${{ inputs.tag }}
          path: rust/target/package/*.crate
          if-no-files-found: error
      - run: git checkout -- rust
      - if: ${{ !inputs.publish }}
        run: echo "publish is off, would publish to crates.io here"
      # Trusted-publishing token exchange. continue-on-error so the first publish (crate not yet
      # registered, no trusted publisher possible) falls back to the CARGO_REGISTRY_TOKEN secret.
      - id: auth
        if: ${{ inputs.publish }}
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        continue-on-error: true
      # publish stamps the manifest itself and refuses to run on an already dirty tree.
      - if: ${{ inputs.publish }}
        run: task rust:publish TAG="$TAG"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
      - if: ${{ inputs.publish }}
        run: task rust:verify TAG="$TAG"
