name: Release go

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      publish:
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the go/vX.Y.Z tag
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # go:publish checks and pushes tags
          persist-credentials: true # go:publish pushes the go/vX.Y.Z tag with the checkout's token
      - uses: ./.github/actions/setup-go
      - run: task go:check
      - run: task go:publish:dry-run TAG="$TAG"
      - run: task go:package TAG="$TAG" OUT="$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eyepop-go-${{ inputs.tag }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
      - if: ${{ !inputs.publish }}
        run: echo "publish is off, would publish to proxy.golang.org (git tag go/vX.Y.Z) here"
      - if: ${{ inputs.publish }}
        run: task go:publish TAG="$TAG"
      - if: ${{ inputs.publish }}
        run: task go:verify TAG="$TAG"
