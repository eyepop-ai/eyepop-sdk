name: CI cs

on:
  pull_request:
    paths: &paths
      - 'cs/**'
      - 'scripts/**'
      - '.github/workflows/ci-cs.yaml'
      - '.github/actions/setup-cs/**'
  push:
    branches: [main]
    paths: *paths

concurrency:
  group: ci-cs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cs
      # Same as `task cs:check` from the repo root.
      - run: task check
      - name: Release dry-run
        run: |
          task package TAG=v0.0.0-alpha.0 OUT="$RUNNER_TEMP/out"
          task publish:dry-run TAG=v0.0.0-alpha.0
