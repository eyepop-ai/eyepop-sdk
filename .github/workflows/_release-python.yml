name: Release python

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      publish:
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # setuptools-scm needs tags
          persist-credentials: false
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ github.token }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: task python:check
      - run: task python:publish:dry-run TAG="$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eyepop-python-${{ inputs.tag }}
          path: python/dist/*
          if-no-files-found: error
      - if: ${{ !inputs.publish }}
        run: echo "publish is off, would publish to PyPI here"
      - if: ${{ inputs.publish }}
        run: task python:publish TAG="$TAG"
      - if: ${{ inputs.publish }}
        run: task python:verify TAG="$TAG"
