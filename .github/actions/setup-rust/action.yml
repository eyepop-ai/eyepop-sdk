name: Set up rust
description: Task and the Rust toolchain for the rust Language SDK. Run after checkout.
runs:
  using: composite
  steps:
    - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
      with:
        repo-token: ${{ github.token }}
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; toolchain pinned via input
      with:
        toolchain: stable
        components: rustfmt, clippy
