name: Set up python
description: Task, uv and the locked sync for the python Language SDK. Run after checkout.
inputs:
  cache:
    description: Cache uv downloads. Off for releases, so a cache cannot reach a published package.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
      with:
        repo-token: ${{ github.token }}
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: ${{ inputs.cache }}
        cache-dependency-glob: python/uv.lock
    # Fails if uv.lock is out of sync with pyproject.toml.
    - run: uv sync --locked
      shell: bash
      working-directory: python
