name: Set up node
description: Task, Node and the locked npm install for the node Language SDK. Run after checkout.
inputs:
  cache:
    description: Cache npm downloads. Off for releases, so a cache cannot reach a published package.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
      with:
        repo-token: ${{ github.token }}
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org
        cache: ${{ inputs.cache == 'true' && 'npm' || '' }}
        cache-dependency-path: node/package-lock.json
    # Fails if package-lock.json is out of sync with the manifests, before anything stamps them.
    - run: npm ci --no-audit --no-fund
      shell: bash
      working-directory: node
