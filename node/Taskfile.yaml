version: '3'

# Node Language SDK (npm workspaces under packages/*). Implements the contract in ../Taskfile.yaml.
# Tasks only call scripts/. TAG=vX.Y.Z is mapped to an npm version by ../scripts/version.sh.
# Adding a package under packages/ needs no change here: the scripts loop over every workspace.
# Scripts read TAG from the environment; this makes `task stamp TAG=v1.2.3` work as well as `TAG=v1.2.3 task stamp`.
env:
  TAG: '{{.TAG}}'

tasks:
  build:
    cmds:
      - npm install --no-audit --no-fund
      - npm run build --workspaces

  test:
    cmds:
      - task: build
      - npm test --workspaces

  lint:
    desc: ESLint and Prettier check
    cmds:
      - npm install --no-audit --no-fund
      - npx eslint .
      - npx prettier --check .

  typecheck:
    desc: tsc --noEmit in every workspace
    cmds:
      - npm install --no-audit --no-fund
      - npm run typecheck --workspaces

  check:
    desc: The CI gate. lint, typecheck, test
    cmds:
      - task: lint
      - task: typecheck
      - task: test

  stamp:
    desc: Write TAG's version into every workspace manifest
    requires: { vars: [TAG] }
    cmds:
      - scripts/stamp.sh

  publish:dry-run:
    requires: { vars: [TAG] }
    cmds:
      - task: build
      - scripts/publish.sh --dry-run

  publish:
    desc: Publish every workspace with provenance; skips versions already on the registry
    requires: { vars: [TAG] }
    cmds:
      - task: build
      - scripts/publish.sh

  verify:
    desc: Install the published packages and assert eyepop.version() == TAG's version
    requires: { vars: [TAG] }
    cmds:
      - scripts/verify.sh
