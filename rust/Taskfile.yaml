version: '3'

# Rust Language SDK. Implements the contract in ../Taskfile.yaml. Tasks only call scripts/.
# TAG=vX.Y.Z is mapped to a cargo version by ../scripts/version.sh.
# Scripts read TAG from the environment; this makes `task stamp TAG=v1.2.3` work as well as `TAG=v1.2.3 task stamp`.
env:
  TAG: '{{.TAG}}'

tasks:
  build:
    cmds:
      - cargo build

  test:
    cmds:
      - cargo test

  lint:
    desc: rustfmt check and clippy with warnings as errors
    cmds:
      - cargo fmt --check
      - cargo clippy --all-targets -- -D warnings

  typecheck:
    cmds:
      - cargo check --all-targets

  check:
    desc: The CI gate. lint, typecheck, test
    cmds:
      - task: lint
      - task: typecheck
      - task: test

  stamp:
    desc: Write TAG's version into the crate manifest (revert to 0.0.0 afterwards)
    requires: { vars: [TAG] }
    cmds:
      - scripts/stamp.sh

  publish:dry-run:
    requires: { vars: [TAG] }
    cmds:
      - scripts/publish.sh --dry-run

  publish:
    desc: Stamp, then publish to crates.io; skips a version already published
    requires: { vars: [TAG] }
    cmds:
      - scripts/publish.sh

  verify:
    desc: Build against the published crate and assert eyepop::version() == TAG's version
    requires: { vars: [TAG] }
    cmds:
      - scripts/verify.sh
